name: Weekly job search

on:
  schedule:
    # GitHub Actions cron uses UTC; 00:00 UTC is 08:00 in Taiwan.
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-job-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-and-notify:
    runs-on: ubuntu-latest
    env:
      JSN_DATABASE_PATH: /tmp/jsn/jobs.sqlite3
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Restore private job-search settings
        env:
          JSN_SETTINGS_YAML: ${{ secrets.JSN_SETTINGS_YAML }}
        run: |
          if [ -z "${JSN_SETTINGS_YAML:-}" ]; then
            echo "Missing repository secret JSN_SETTINGS_YAML" >&2
            exit 1
          fi
          printf '%s' "$JSN_SETTINGS_YAML" > config/settings.yaml
          chmod 600 config/settings.yaml

      - name: Restore SQLite state from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_OBJECT_KEY: ${{ vars.R2_OBJECT_KEY }}
        run: |
          : "${R2_ACCOUNT_ID:?Missing repository variable R2_ACCOUNT_ID}"
          : "${R2_BUCKET_NAME:?Missing repository variable R2_BUCKET_NAME}"
          : "${R2_OBJECT_KEY:?Missing repository variable R2_OBJECT_KEY}"
          : "${AWS_ACCESS_KEY_ID:?Missing secret R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Missing secret R2_SECRET_ACCESS_KEY}"
          mkdir -p "$(dirname "$JSN_DATABASE_PATH")"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          error_file="${RUNNER_TEMP}/r2-head-object.err"
          if aws s3api head-object \
            --bucket "$R2_BUCKET_NAME" \
            --key "$R2_OBJECT_KEY" \
            --endpoint-url "$endpoint" \
            >/dev/null 2>"$error_file"; then
            aws s3 cp \
              "s3://${R2_BUCKET_NAME}/${R2_OBJECT_KEY}" \
              "$JSN_DATABASE_PATH" \
              --endpoint-url "$endpoint" \
              --only-show-errors
          elif grep -Eq '404|Not Found|NoSuchKey' "$error_file"; then
            echo "No previous SQLite state found in R2; starting with an empty database."
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Collect, filter, and notify
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_OPENAI_COMPATIBLE_URL: ${{ vars.LLM_OPENAI_COMPATIBLE_URL }}
          # Retain this name for private settings files created before provider selection was added.
          LLM_CHAT_COMPLETIONS_URL: ${{ vars.LLM_CHAT_COMPLETIONS_URL }}
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
        run: uv run --locked --no-sync jsn

      - name: Persist SQLite state to Cloudflare R2
        if: always() && steps.checkout.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_OBJECT_KEY: ${{ vars.R2_OBJECT_KEY }}
        run: |
          if [ -f "$JSN_DATABASE_PATH" ]; then
            endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            echo "Uploading SQLite state to the configured R2 object."
            aws s3 cp \
              "$JSN_DATABASE_PATH" \
              "s3://${R2_BUCKET_NAME}/${R2_OBJECT_KEY}" \
              --endpoint-url "$endpoint" \
              --only-show-errors
            echo "SQLite state uploaded successfully."
          else
            echo "::warning::SQLite state was not found at $JSN_DATABASE_PATH; no R2 upload was made."
          fi

  notify-failure:
    needs: collect-and-notify
    if: ${{ always() && needs.collect-and-notify.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord of failure
        env:
          DISCORD_FORUM_WEBHOOK_URL: ${{ secrets.DISCORD_FORUM_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_FORUM_WEBHOOK_URL:-}" ]; then
            echo "Missing repository secret DISCORD_FORUM_WEBHOOK_URL" >&2
            exit 1
          fi
          payload=$(python3 -c '
          import json, os
          run_url = "{}/{}/actions/runs/{}".format(os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])
          content = "⚠️ {} failed.\nBranch: {}\nRun: {}".format(os.environ["GITHUB_WORKFLOW"], os.environ["GITHUB_REF_NAME"], run_url)
          print(json.dumps({"thread_name": "⚠️ JSN 執行失敗 #{}".format(os.environ["GITHUB_RUN_ID"]), "content": content, "allowed_mentions": {"parse": []}}))
          ')
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --header 'Content-Type: application/json' \
            --data "$payload" "$DISCORD_FORUM_WEBHOOK_URL" > /dev/null
