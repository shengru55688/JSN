[project]
name = "jsn-job-digest"
version = "0.1.0"
description = "Collect LinkedIn job alerts and publish a weekly Discord digest"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-genai>=1,<2",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.scripts]
jsn = "jsn.pipeline:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jsn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
